services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zillow_service
      POSTGRES_USER: zillow
      POSTGRES_PASSWORD: zillow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  web:
    build: ./zillow_service
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8001"
    volumes:
      - ./zillow_service:/app
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=zillow_service
      - POSTGRES_USER=zillow
      - POSTGRES_PASSWORD=zillow
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: ./zillow_service
    command: celery -A config worker -l info
    volumes:
      - ./zillow_service:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=zillow_service
      - POSTGRES_USER=zillow
      - POSTGRES_PASSWORD=zillow
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
