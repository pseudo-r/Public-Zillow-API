[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zillow_service"
version = "1.0.0"
description = "Django REST service wrapping Zillow's undocumented API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "httpx[http2]>=0.27",
    "parsel>=1.9",
    "structlog>=24.1",
    "tenacity>=8.2",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.3",
    "python-decouple>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "coverage[toml]>=7.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["apps", "clients"]
omit = ["*/migrations/*", "*/tests/*"]
